name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发环境保持一致（本地 Node 24）。
          # 用 20 会因 jsdom→undici 的 webidl.util.markAsUncloneable 缺失而测试崩溃。
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑测试（不通过就不部署）
        run: npx vitest run

      - name: 构建
        env:
          # 项目页部署在 /<repo>/ 子路径下，必须注入 base，
          # 否则所有资源 404、页面白屏
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: 检查 404 兜底是否生成（SPA 刷新依赖它）
        run: test -f dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
